global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    service: seoga
    env: local

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: seoga-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8100"]
        labels:
          service: seoga-api
          env: local

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
