name: seo-index

# GSC URL Inspection API로 색인 상태를 주간 점검 (서비스계정이 GSC 속성 사용자여야 함)
on:
  schedule:
    - cron: "10 0 * * 1" # 월요일 09:10 KST
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: GSC URL Inspection
        env:
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
        run: |
          python scripts/gsc_index_status.py --limit 30

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gsc-index-status
          path: gsc_index_status.json
          if-no-files-found: ignore
