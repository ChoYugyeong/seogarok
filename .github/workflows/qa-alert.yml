name: qa-alert

# qa-gate 실패 시 GitHub Issue 자동 생성, 회복 시 자동 닫기
# - workflow_run: qa-gate 완료 시 자동 실행
# - workflow_dispatch: mode=failure|recovery 로 알림 경로 테스트
# - 선택: ALERT_WEBHOOK_URL 시크릿이 있으면 Slack/Discord 웹훅으로도 전송

on:
  workflow_run:
    workflows: ["qa-gate"]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: "auto | failure | recovery (테스트)"
        required: false
        default: "auto"

permissions:
  issues: write
  actions: read
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create/close QA issue
        uses: actions/github-script@v7
        env:
          MODE: ${{ github.event.inputs.mode || 'auto' }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          RUN_URL: ${{ github.event.workflow_run.html_url || '' }}
        with:
          script: |
            const mode = (process.env.MODE || 'auto').toLowerCase();
            const conclusion = process.env.CONCLUSION || '';
            const runUrl = process.env.RUN_URL || '(수동 테스트)';
            const isFailure = mode === 'failure' || (mode === 'auto' && conclusion === 'failure');
            const isRecovery = mode === 'recovery' || (mode === 'auto' && conclusion === 'success');
            const label = 'qa-failure';
            const title = '🚨 QA gate 실패 (자동 생성)';
            const { owner, repo } = context.repo;

            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: label, per_page: 10,
            });
            const existing = open.data[0];

            if (isFailure) {
              const body = [
                '**qa-gate 워크플로가 실패했습니다.**',
                '',
                `- run: ${runUrl}`,
                `- conclusion: \`${conclusion || 'manual'}\``,
                `- 시각: ${new Date().toISOString()}`,
                '',
                '대응: `gh run view --log-failed` 로 실패 단계 확인 → 수정 후 재실행.',
              ].join('\n');
              if (existing) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.number,
                  body: `재발생 (${new Date().toISOString()})\n${runUrl}`,
                });
                core.info(`updated issue #${existing.number}`);
              } else {
                const created = await github.rest.issues.create({ owner, repo, title, body, labels: [label] });
                core.info(`created issue #${created.data.number}`);
              }
            } else if (isRecovery && existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: 'qa-gate 회복 확인 — 이슈를 닫습니다.',
              });
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' });
              core.info(`closed issue #${existing.number}`);
            } else {
              core.info('nothing to do');
            }

      - name: Optional webhook (Slack/Discord)
        if: env.WEBHOOK != ''
        env:
          WEBHOOK: ${{ secrets.ALERT_WEBHOOK_URL }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          RUN_URL: ${{ github.event.workflow_run.html_url || '' }}
        run: |
          echo "sending webhook"
          curl -sS -X POST "$WEBHOOK" -H 'Content-Type: application/json' \
            -d "{\"text\":\"서가록 qa-gate: ${CONCLUSION:-manual} ${RUN_URL:-}\", \"content\":\"서가록 qa-gate: ${CONCLUSION:-manual} ${RUN_URL:-}\"}" \
            --max-time 15 || true
