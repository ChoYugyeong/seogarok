name: ai-crawl

# 매일 04:10 KST: AI/검색 크롤러가 읽는 표면을 고신선도로 유지한다.
# - IndexNow(Bing·Yandex 등) 표본 제출 — Bing은 ChatGPT 검색의 인덱스 기반
# - robots.txt·Content-Signal·sitemap·llms.txt·llms-full.txt 응답 검증

on:
  workflow_dispatch:
  schedule:
    - cron: "10 19 * * *"

permissions:
  contents: read

jobs:
  crawl-ready:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Submit IndexNow sample
        run: |
          set -euo pipefail
          python scripts/submit_indexnow.py --limit 200

      - name: Verify AI/search surfaces
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request
          checks = {
            "robots": "https://seogarok.com/robots.txt",
            "llms": "https://seogarok.com/llms.txt",
            "llms_full": "https://seogarok.com/llms-full.txt",
            "sitemap_index": "https://seogarok.com/sitemap-index.xml",
            "sitemap_books": "https://seogarok.com/sitemap-books.xml",
          }
          bodies = {}
          for name, url in checks.items():
            req = urllib.request.Request(url, headers={"User-Agent": "seogarok-ai-crawl/1"})
            with urllib.request.urlopen(req, timeout=40) as r:
              assert r.status == 200, (name, r.status)
              bodies[name] = r.read().decode("utf-8", "ignore")
          assert "Content-Signal" in bodies["robots"], "robots Content-Signal missing"
          assert "Sitemap:" in bodies["robots"], "robots Sitemap missing"
          assert "서가록" in bodies["llms"], "llms.txt missing brand"
          assert "<sitemapindex" in bodies["sitemap_index"], "sitemap index malformed"
          assert bodies["sitemap_books"].count("<loc>") > 10000, "books sitemap too small"
          print("AI surfaces OK", {k: len(v) for k, v in bodies.items()})
          PY
